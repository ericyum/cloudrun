<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        
        <form action="{{ url_for('add_task') }}" method="post">
            <input type="text" name="task" placeholder="Add a new task..." required>
            <button type="submit">Add</button>
        </form>

                <h2>Pending Tasks</h2>
        <ul class="todo-list">
            {% for todo in todos %}
                {% if not todo.done %}
                    <li>
                        <a href="{{ url_for('complete_task', todo_id=todo.id) }}" class="status-btn"></a>
                        <span class="task-text">{{ todo.task }}</span>
                        <a href="{{ url_for('edit_task', todo_id=todo.id) }}" class="edit-btn">Edit</a>
                        <a href="{{ url_for('delete_task', todo_id=todo.id) }}" class="delete-btn">Delete</a>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>

        <h2>Completed Tasks</h2>
        <ul class="todo-list">
            {% for todo in todos %}
                {% if todo.done %}
                    <li class="done">
                        <a href="{{ url_for('complete_task', todo_id=todo.id) }}" class="status-btn"></a>
                        <span class="task-text">{{ todo.task }}</span>
                        <a href="{{ url_for('edit_task', todo_id=todo.id) }}" class="edit-btn">Edit</a>
                        <a href="{{ url_for('delete_task', todo_id=todo.id) }}" class="delete-btn">Delete</a>
                    </li>
                {% endif %}
            {% endfor %}
        </ul>
    </div>
</body>
</html>
